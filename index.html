<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5eee2">
  <meta name="description" content="Jemputan majlis penyatuan dua hati Ahsan Fawwaz dan Siti Khairulbariyah, 25 Disember 2026.">
  <title>Jemputan Perkahwinan · Ahsan & Bariyah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="invitation" aria-label="Jemputan perkahwinan">
    <!-- Slide 1: cover artwork -->
    <section class="page" id="cover" aria-label="Muka hadapan">
      <div class="artboard raster-page">
        <img src="assets/1.png" alt="" class="full-art" fetchpriority="high" decoding="async">
      </div>
    </section>

    <!-- Slide 2: names -->
    <section class="page" id="names" aria-label="Nama pengantin">
      <div class="artboard raster-page">
        <img src="assets/2.png" alt="" class="full-art" fetchpriority="high" decoding="async">
      </div>
    </section>

    <!-- Slide 3 -->
    <section class="page" id="invite" aria-label="Jemputan">
      <div class="artboard raster-page">
        <img src="assets/3.png" alt="" class="full-art" decoding="async">
      </div>
    </section>

    <!-- Slide 4: countdown and map links -->
    <section class="page" id="details" aria-label="Tarikh, masa dan lokasi">
      <div class="artboard raster-page details-page">
        <img src="assets/4.png" alt="Tarikh: Jumaat, 25 Disember 2026. Masa: 7.30 malam hingga 10.30 malam. Tempat: Glass Hall by Lugar de la Boda, Puchong Prima, Selangor." class="full-art" decoding="async">
        <div class="countdown" aria-label="Kiraan detik menuju majlis">
          <div class="countdown-values" aria-live="off">
            <span id="days">00</span><b>:</b><span id="hours">00</span><b>:</b><span id="minutes">00</span><b>:</b><span id="seconds">00</span>
          </div>
          <div class="countdown-labels"><span>DAYS</span><span>HOURS</span><span>MINS</span><span>SECS</span></div>
        </div>
        <a class="map-hotspot google-maps" href="https://maps.app.goo.gl/VzFBSdbyjby2debo6" target="_blank" rel="noopener" aria-label="Buka lokasi di Google Maps" title="Google Maps"></a>
        <a class="map-hotspot waze" href="https://waze.com/ul?q=GLASS%20HALL%20BY%20LUGAR%20DE%20LA%20BODA&navigate=yes" target="_blank" rel="noopener" aria-label="Buka lokasi di Waze" title="Waze"></a>
      </div>
    </section>

    <!-- Slide 5: schedule -->
    <section class="page" id="schedule" aria-label="Atur cara majlis">
      <div class="artboard raster-page">
        <img src="assets/5.png" alt="Atur cara: 7.30 malam kehadiran tetamu; 8.00 malam perarakan masuk pengantin; 8.45 malam sesi potong kek; 9.30 malam sesi bergambar dan beramah mesra; 10.30 malam majlis bersurai." class="full-art" loading="lazy" decoding="async">
      </div>
    </section>

    <!-- Slide 6: prayer and contacts -->
    <section class="page" id="contact" aria-label="Doa dan maklumat hubungan">
      <div class="artboard raster-page">
        <img src="assets/6.png" alt="Doa buat pengantin dan maklumat hubungan keluarga." class="full-art" loading="lazy" decoding="async">
      </div>
    </section>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
